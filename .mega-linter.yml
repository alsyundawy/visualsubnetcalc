---
# MegaLinter configuration file
# Reference: https://megalinter.io/configuration/

APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: true

# Ignore vendor files and binary builds
FILTER_REGEX_EXCLUDE: (node_modules|dist/css/bootstrap.min.css|dist/js/lz-string.min.js|src/certs)

# Enable all linters for Markdown, JavaScript / Node.js, TypeScript, CSS, and HTML
ENABLE:
  - MARKDOWN
  - JAVASCRIPT
  - TYPESCRIPT
  - CSS
  - HTML
  - JSON
  - YAML

# Disable non-applicable linter categories
DISABLE:
  - COPYPASTE
  - SPELL

# Explicitly enable linters for Markdown, HTML, CSS, JavaScript (Node.js), and TypeScript
ENABLE_LINTERS:
  - MARKDOWN_MARKDOWNLINT
  - HTML_HTMLHINT
  - CSS_STYLELINT
  - JAVASCRIPT_ES
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_ES
  - TYPESCRIPT_STANDARD

# Non-blocking reporting for standard.js while ESLint enforces strict syntax & correctness
JAVASCRIPT_STANDARD_DISABLE_ERRORS: true
TYPESCRIPT_STANDARD_DISABLE_ERRORS: true

# CloudFormation templates use AWS intrinsic tags (!Ref, !Sub, etc.) which are not standard JSON schemas
YAML_V8R_FILTER_REGEX_EXCLUDE: (src/cloudformation.yaml)
